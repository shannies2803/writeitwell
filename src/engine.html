<title>Write It Well</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: an exercise book. Ruled-paper header with a red margin line, lesson index on the left, one lesson page at a time with practice cards that award stars. */
:root{
  --paper:#F8FAFE; --card:#FFFFFF; --ink:#1B2A4A; --muted:#566382;
  --rule:#D6E0F2; --margin:#E0574F; --pencil:#F2B400; --blue:#2E58CF; --blue-soft:#E6EDFC;
  --good:#18774A; --bad:#C2413A; --onpencil:#1B2A4A; --line:#8E9CBB;
  --chipS:78%; --chipL:91%;
  --display:"Shantell Sans","Comic Neue","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121826; --card:#1A2234; --ink:#E9EEF8; --muted:#A1ACC6;
  --rule:#2A3550; --margin:#E8716A; --pencil:#F6C643; --blue:#86A6FF; --blue-soft:#202D4D;
  --good:#5CCB8E; --bad:#F08079; --line:#6B7A9C; --chipS:38%; --chipL:24%; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121826; --card:#1A2234; --ink:#E9EEF8; --muted:#A1ACC6;
  --rule:#2A3550; --margin:#E8716A; --pencil:#F6C643; --blue:#86A6FF; --blue-soft:#202D4D;
  --good:#5CCB8E; --bad:#F08079; --line:#6B7A9C; --chipS:38%; --chipL:24%; color-scheme:dark}
html[lang="zh"]{--display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.85rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}

/* header */
.hero{background:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
  repeating-linear-gradient(180deg,transparent 0 33px,var(--rule) 33px 34px);border-bottom:1px solid var(--rule)}
.hero .wrap{padding-block:22px 20px;padding-left:64px;display:grid;gap:12px}
.topline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.lang{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--rule);border-radius:999px;padding:3px}
.lang button{border:none;background:none;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--paper)}
.hero h1{font-size:clamp(2rem,5.5vw,3rem);font-weight:800}
.hero h1 span{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--pencil) 55%,transparent) 62%)}
.swap{display:grid;gap:2px;font-size:1.05rem;max-width:62ch}
.swap s{color:var(--muted);text-decoration-color:var(--margin);text-decoration-thickness:3px}
.swap b{font-family:var(--display);font-weight:700}
.level{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.badge{background:var(--pencil);color:var(--onpencil);font-weight:800;border-radius:999px;padding:3px 12px;font-size:.9rem}
.meter{flex:1 1 160px;max-width:280px;height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
.level small{color:var(--muted);font-size:.85rem}

/* bar + layout */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}
.bar .cur{font-family:var(--display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.bar .stars{font-weight:700;color:var(--muted);white-space:nowrap;font-size:.92rem}
#menuBtn{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:5px 12px;font-weight:700}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:22px 70px}
nav.index{display:grid;gap:16px;align-content:start}
nav.index[hidden]{display:none!important}
.grp h4{font-size:.78rem;font-family:var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
html[lang="zh"] .grp h4{letter-spacing:.2em}
.grp ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.grp button{width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.grp button:hover{background:var(--blue-soft)}
.grp button[aria-current="page"]{background:var(--pencil);color:var(--onpencil);font-weight:700}
.grp button span.n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp button[aria-current="page"] span.n{color:var(--onpencil)}
.grp button span.n.done{color:var(--good);font-weight:700}
@media (min-width:900px){
  .shell{grid-template-columns:250px minmax(0,1fr);gap:36px}
  nav.index{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding-right:6px}
  nav.index[hidden]{display:grid!important}
  #menuBtn{display:none}
}
@media (max-width:899px){
  nav.index{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:14px}
}
main{min-width:0;display:grid;gap:22px;align-content:start}
.head{display:grid;gap:6px}
.head .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.lead{color:var(--muted);max-width:65ch}
.block{display:grid;gap:12px;min-width:0}
.block>h3{margin-top:6px}

/* shared pieces */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.tag{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex{font-family:var(--display);font-weight:500;background:var(--blue-soft);border-radius:10px;padding:10px 12px}
html[lang="zh"] .ex{font-family:var(--body)}
.tip{border-left:4px solid var(--pencil);padding:10px 14px;background:var(--card);border-radius:0 10px 10px 0;max-width:75ch}
.text{max-width:70ch}
.bad{color:var(--bad)} .good{color:var(--good)}
ul.dots{margin:0;padding-left:1.2em;display:grid;gap:4px}
.btn{border:none;background:var(--blue);color:var(--paper);padding:9px 16px;border-radius:10px;font-weight:700}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.small{padding:5px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--blue-soft);border-radius:999px;padding:3px 11px;font-size:.93rem}
.pill{border:2px solid transparent;border-radius:999px;padding:5px 13px;font-weight:700;background:hsl(var(--h,215) var(--chipS) var(--chipL))}
.pill[aria-pressed="true"]{border-color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.steps li{display:grid;grid-template-columns:42px 1fr;gap:12px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:14px}
.num{width:42px;height:42px;border-radius:50%;background:var(--pencil);color:var(--onpencil);font-family:var(--display);font-weight:800;font-size:1.25rem;display:grid;place-items:center}
.avoid li{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:none}
td.weak{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--margin);white-space:nowrap}
.mountain{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:12px;overflow-x:auto}
.mountain svg{display:block;width:100%;min-width:320px;height:auto}

/* word bank */
.emo-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;display:grid;gap:18px;border-top:8px solid hsl(var(--h) 70% 55%)}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ladder div{border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;font-size:.92rem;background:hsl(var(--h) var(--chipS) var(--chipL));display:grid;gap:4px;align-content:space-between;overflow-wrap:anywhere}
.ladder i{display:block;height:6px;border-radius:3px;background:hsl(var(--h) 70% 52%)}
.scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ts{display:grid;gap:6px}
.ts p{padding:8px 12px;border-radius:10px}
.ts .t{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.ts .s{background:color-mix(in srgb,var(--good) 14%,transparent);font-weight:700}

/* idioms */
.search{max-width:360px}
.idiom{display:grid;gap:4px}
.idiom .w{font-family:var(--display);font-size:1.2rem;font-weight:700}
.idiom .py{color:var(--blue);font-size:.92rem}

/* forms */
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:9px 12px}
textarea{min-height:90px;resize:vertical;background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--rule) 27px 28px);background-attachment:local;line-height:28px}
label{font-weight:700;font-size:.95rem}

/* practice runner */
.runner{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;display:grid;gap:14px;border-top:6px solid var(--pencil)}
.rhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.rcount{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dotsbar{display:flex;flex-wrap:wrap;gap:4px}
.dotsbar button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);background:var(--paper);font-size:.7rem;padding:0;line-height:1;color:var(--muted)}
.dotsbar button.done{background:var(--pencil);border-color:var(--pencil);color:var(--onpencil)}
.dotsbar button.cur{border-color:var(--blue);border-width:2.5px}
.q{font-size:1.1rem;font-weight:700}
.opts{display:grid;gap:7px}
.opts button{text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 13px}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.fb{min-height:1.4em}
.model{background:color-mix(in srgb,var(--good) 12%,transparent);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.wrongbox{background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:10px;padding:10px 12px;font-size:1.08rem}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:6px;border:1.5px dashed var(--rule);border-radius:10px;align-items:center}
.slots .lbl{font-size:.8rem;color:var(--muted)}
.wordbtn{border:1.5px solid var(--rule);background:var(--paper);border-radius:10px;padding:6px 12px;font-weight:700}
.slots .wordbtn{background:var(--blue-soft);border-color:var(--blue-soft)}
.slots .wordbtn.ok{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good)}
.slots .wordbtn.no{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:var(--bad)}
.rnav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

/* essay */
.essay{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 18px 20px 30px;display:grid;gap:14px;
  background-image:linear-gradient(90deg,transparent 14px,var(--margin) 14px,var(--margin) 16px,transparent 16px)}
.essay h3{font-size:1.4rem}
.essay p{max-width:70ch}
html[lang="zh"] .essay p{text-indent:2em}
.essay mark{background:none;color:inherit}
.essay.on mark{border-radius:4px;padding:0 2px}
.essay.on mark.s,.lg.s{background:hsl(140 var(--chipS) var(--chipL))}
.essay.on mark.sh,.lg.sh{background:hsl(270 var(--chipS) var(--chipL))}
.essay.on mark.f,.lg.f{background:hsl(340 var(--chipS) var(--chipL))}
.essay.on mark.d,.lg.d{background:hsl(210 var(--chipS) var(--chipL))}
.essay.on mark.fig,.lg.fig{background:hsl(28 var(--chipS) var(--chipL))}
.essay.on mark.id,.lg.id{background:hsl(180 var(--chipS) var(--chipL))}
.essay.on mark.c,.lg.c{background:none;text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:4px;text-underline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.88rem}
.legend span{padding:2px 10px;border-radius:999px}

/* studio */
.studio{display:grid;gap:14px}
.timer{font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.studio textarea{min-height:340px}
.prog{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.checks{display:grid;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:6px 4px;border-bottom:1px dashed var(--rule)}
.checks input{width:20px;height:20px;margin-top:4px;accent-color:var(--good);flex:0 0 auto}
.plan{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.field{display:grid;gap:4px;min-width:0}
.toast{font-size:.9rem;color:var(--good);font-weight:700}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:18px}
.pager button{border:1.5px solid var(--rule);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;display:grid;max-width:48%}
.pager button small{color:var(--muted);font-size:.78rem}
.pager .nx{text-align:right;margin-left:auto}

/* round 3 additions */
main{scroll-margin-top:64px}
.lang button{min-height:40px}
.btn.small{min-height:38px}
.dotsbar button{width:30px;height:30px;border-color:var(--line);font-size:.75rem}
.meter,.prog{outline:1px solid var(--line);outline-offset:0}
.bar .stars{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:5px 12px;color:var(--ink)}
.streak{font-size:.85rem;color:var(--muted)}
#pyBtn{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:5px 10px;font-weight:700}
#pyBtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
html.nopy .py{display:none}
.listen{border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;color:var(--blue);justify-self:start}
.chip.saveable{cursor:pointer;border:1.5px solid transparent}
.chip.saveable:hover{border-color:var(--blue)}
.chip.saved{background:var(--pencil);color:var(--onpencil)}
.chip.saved::after{content:" ★"}
.flash{min-height:150px;display:grid;place-items:center;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:18px;font-size:1.15rem}
.flash .front{font-family:var(--display);font-size:1.7rem;font-weight:700;display:grid;gap:4px}
.flash .front .py{font-family:var(--body);font-size:1rem;color:var(--blue);font-weight:400}
.done-card{background:color-mix(in srgb,var(--good) 14%,transparent);border-radius:12px;padding:12px 14px;font-weight:700;color:var(--good)}
.toast-pop{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.pulse{animation:pop .5s ease}
.burst{position:fixed;pointer-events:none;z-index:21;font-size:22px;color:var(--pencil);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.panel{position:fixed;inset:0;z-index:15;background:var(--paper);overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px))}
.panel .wrap{display:grid;gap:18px;max-width:900px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap}
.ptabs button{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:700;min-height:40px}
.ptabs button[aria-selected="true"]{background:var(--pencil);border-color:var(--pencil);color:var(--onpencil)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat div{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.urow{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--rule)}
.urow .prog{height:8px}
.urow span{font-variant-numeric:tabular-nums;font-size:.88rem;text-align:right;color:var(--muted)}
@media (max-width:899px){
  nav.index:not([hidden]){position:fixed;inset:calc(54px + env(safe-area-inset-top,0px)) 0 0 0;z-index:7;overflow:auto;border-radius:0;border-inline:none;padding:16px 16px calc(30px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){.swap{display:none}}
@media (prefers-reduced-motion:reduce){.pulse,.burst{animation:none}.burst{display:none}}

/* round 4: learners, coach, parent view */
#whoBtn{border:1.5px solid var(--pencil);background:var(--card);border-radius:10px;padding:5px 12px;font-weight:700;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
html:not(.coach) .coach-ui{display:none!important}
.coachout{display:grid;gap:10px}
.coachcard{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:12px}
.coachcard h4{margin-top:4px}
.coachcard .band{font-size:1.2rem;color:var(--onpencil);background:var(--pencil);border-radius:10px;padding:6px 12px;justify-self:start}
.coachcard q{font-style:italic;background:var(--blue-soft);border-radius:6px;padding:0 4px}
.coachcard .ex.inline{display:inline-block;margin-top:4px;padding:4px 10px}
.coachmini{display:grid;gap:6px;margin-top:6px}
.vd{padding:8px 12px;border-radius:10px}
.vd-great{background:color-mix(in srgb,var(--good) 16%,transparent)}
.vd-good{background:var(--blue-soft)}
.vd-try{background:color-mix(in srgb,var(--pencil) 22%,transparent)}
.thinking{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.learners{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.learner{border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:14px;text-align:left;display:grid;gap:2px;min-height:72px}
.learner b{font-family:var(--display);font-size:1.25rem}
.learner span{color:var(--muted);font-size:.88rem}
.learner.on{border-color:var(--pencil);box-shadow:0 0 0 2px var(--pencil) inset}
.fam{gap:14px}
.fam-lang{display:grid;gap:4px;min-width:0}
.fam .urow{grid-template-columns:minmax(0,1fr) 90px 60px}
.wr{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--paper)}

const ITEM={};
function runner(b,ctx,renderItem){
  const K=k=>b.keys?b.keys[k]:ctx.key+":"+k;
  const w=el("div","runner");const n=b.items.length;let i=0;
  // start at first item without a star
  for(let k=0;k<n;k++){if(!hasStar(K(k))){i=k;break}}
  const head=el("div","rhead",'<h3>'+(b.title||"")+'</h3><span class="rcount"></span>');
  const intro=b.intro?el("p","muted",b.intro):null;
  const dots=el("div","dotsbar");
  const body=el("div","block");
  const nav=el("div","rnav",'<button class="btn ghost small" data-d="-1">← '+(lang==="zh"?"上一题":ui().prev)+'</button><button class="btn small" data-d="1">'+(lang==="zh"?"下一题":ui().next)+' →</button>');
  function drawDots(){dots.innerHTML=b.items.map((_,k)=>'<button data-k="'+k+'" class="'+(hasStar(K(k))?"done ":"")+(k===i?"cur":"")+'" aria-label="'+(k+1)+'">'+(hasStar(K(k))?"★":(k+1))+'</button>').join("");
    head.querySelector(".rcount").textContent=ui().of(i+1,n)+" · ★ "+b.items.filter((_,k)=>hasStar(K(k))).length+"/"+n;}
  const doneEl=el("p","done-card",ui().setDone);doneEl.hidden=true;
  function allDone(){return b.items.every((_,k)=>hasStar(K(k)))}
  function award(from,auto){const fresh=giveStar(K(i),from);drawDots();refreshNav();doneEl.hidden=!allDone();
    if(fresh&&auto&&!allDone()){const me=i;setTimeout(()=>{if(i!==me||!document.body.contains(w))return;let k=(i+1)%n;for(let c=0;c<n;c++){const kk=(i+1+c)%n;if(!hasStar(K(kk))){k=kk;break}}go(k)},1400)}}
  function go(k){i=(k+n)%n;body.innerHTML="";renderItem(b.items[i],body,award,i,K(i));drawDots();
    nav.querySelector('[data-d="-1"]').disabled=false;}
  dots.addEventListener("click",ev=>{const d=ev.target.closest("button");if(d)go(+d.dataset.k)});
  nav.addEventListener("click",ev=>{const d=ev.target.closest("button");if(d)go(i+ +d.dataset.d)});
  doneEl.hidden=!allDone();w.append(head);if(intro)w.append(intro);w.append(dots,body,doneEl,nav);go(i);return w;
}

function migrateTo(id){

/* cloud */
let DB=null,CLOUD=false;const remote={};
let pushT=null,pushing=false,pushAgain=false;
function schedulePush(){if(!DB||!LID)return;clearTimeout(pushT);pushT=setTimeout(doPush,2500)}
async function doPush(){if(!DB||!LID)return;if(pushing){pushAgain=true;return}pushing=true;
  try{const l=LEARNERS.find(x=>x.id===LID)||{};
    await DB.doc("learners/"+LID).set({name:l.name||"",level:l.level||"",createdAt:l.createdAt||Date.now(),stars,days:lstore.get("wiw2-days",[]),
      words:{en:lstore.get("wiw2-words-en",[]),zh:lstore.get("wiw2-words-zh",[])},wordsAt:store.get("wiw2-wordsAt:"+LID,0),updatedAt:Date.now()})}catch(e){}
  pushing=false;if(pushAgain){pushAgain=false;doPush()}}
function mergeActive(rerender){
  if(!LID||!remote[LID])return;const r=remote[LID];let changed=false,localExtra=false;
  const rs=r.stars||{};Object.keys(rs).forEach(k=>{if(!stars[k]){stars[k]=1;changed=true}});
  Object.keys(stars).forEach(k=>{if(!rs[k])localExtra=true});
  const days=lstore.get("wiw2-days",[]);const ds=new Set(days);(r.days||[]).forEach(d=>{if(!ds.has(d)){days.push(d);ds.add(d);changed=true}});
  if((r.days||[]).length<days.length)localExtra=true;
  if((r.wordsAt||0)>store.get("wiw2-wordsAt:"+LID,0)&&r.words){store.set("wiw2-words-en:"+LID,r.words.en||[]);store.set("wiw2-words-zh:"+LID,r.words.zh||[]);store.set("wiw2-wordsAt:"+LID,r.wordsAt);changed=true}
  else if(store.get("wiw2-wordsAt:"+LID,0)>(r.wordsAt||0))localExtra=true;
  if(changed){store.set("wiw2-stars:"+LID,stars);days.sort();store.set("wiw2-days:"+LID,days.slice(-400));
    if(rerender!==false){refreshProgress();refreshNav();markChips()}}
  if(localExtra)schedulePush();
}
function startSync(){
  try{DB.collection("learners").onSnapshot(snap=>{CLOUD=true;
    snap.docs.forEach(d=>{if(!d.exists)return;const v=d.data();remote[d.id]=v;
      const ex=LEARNERS.find(x=>x.id===d.id);
      if(!ex)LEARNERS.push({id:d.id,name:String(v.name||""),level:String(v.level||""),createdAt:v.createdAt||0});
      else{ex.name=String(v.name||ex.name);ex.level=String(v.level||ex.level)}});
    store.set("wiw2-learners",LEARNERS);mergeActive(true);renderWho();
    const p=$("#panel");if(!p.hidden&&p.dataset.tab==="who")openWho();
  },()=>{})}catch(e){}
}

  out.textContent=code==="rate_limited"?c.errRate:code==="refused"?c.errRefused:code==="session_expired"?c.errSignin:code==="cancelled"?"":c.errOther}
const arr=x=>Array.isArray(x)?x:[];
function coachHTML(f){const c=cu();if(!f||typeof f!=="object")return"";const band=Math.max(1,Math.min(3,parseInt(f.band,10)||1));
  return '<div class="coachcard"><p class="band">'+"★".repeat(band)+"☆".repeat(3-band)+' <b>'+c.band[band-1]+'</b></p>'+
   (f.cheer?'<p>'+esc(f.cheer)+'</p>':'')+
   (arr(f.strengths).length?'<h4>'+c.strengths+'</h4><ul class="dots">'+arr(f.strengths).map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul>':'')+
   (arr(f.improve).length?'<h4>'+c.improve+'</h4><ul class="dots">'+arr(f.improve).map(s=>'<li>'+(s.quote?'<q>'+esc(s.quote)+'</q> ':'')+esc(s.tip||"")+(s.example?'<br><span class="ex inline">'+esc(s.example)+'</span>':'')+'</li>').join("")+'</ul>':'')+

   (f.upgrade&&f.upgrade.after?'<h4>'+c.upgrade+'</h4><div class="ts"><p class="t">'+c.before+': '+esc(f.upgrade.before||"")+'</p><p class="s">'+c.after+': '+esc(f.upgrade.after)+'</p></div>':'')+
   (f.next?'<h4>'+c.next+'</h4><p class="tip">'+esc(f.next)+'</p>':'')+'</div>'}
function learnerLevel(){const l=LEARNERS.find(x=>x.id===LID);return (l&&l.level)||""}
function studioPrompt(topic,text){const lv=learnerLevel();
  if(lang==="zh")return "你是一位亲切、鼓励学生的华文作文小老师，学生是新加坡小学生"+(lv?"（"+lv+"）":"")+"。请阅读学生的作文，用孩子看得懂的简单中文给出反馈。题目：《"+topic+"》。\n要求：直接对学生说话（用“你”）；具体表扬写得好的地方；不要把整篇作文重写；引用作文里的短句时必须一字不差；错误最多列出6个（错别字、标点、病句、的地得、词语搭配），最重要的放前面；诚实但温和；按这个年级的水平来评价；如果作文太短、离题或不是记叙文，请在 cheer 里温和地说明，并给出开始的建议。\n只回复JSON，格式如下：\n{\"band\":1到3的整数（1=继续加油，2=写得不错，3=非常出色，按该年级标准）,\"cheer\":\"一两句鼓励的话\",\"strengths\":[\"…\",\"…\"],\"improve\":[{\"quote\":\"作文中的原句\",\"tip\":\"可以怎样改\",\"example\":\"改好的例子\"}],\"mistakes\":[{\"wrong\":\"…\",\"right\":\"…\",\"why\":\"…\"}],\"upgrade\":{\"before\":\"作文中的一个句子\",\"after\":\"更生动的写法\"},\"next\":\"下次写作的一个目标\"}\nimprove 给2到3条。\n学生作文：\n<<<\n"+text.slice(0,12000)+"\n>>>";
  return "You are a warm, encouraging writing coach for a Singapore primary school pupil"+(lv?" ("+lv+")":"")+". Read the pupil's composition and give feedback a child can understand. Topic: \""+topic+"\".\nRules: talk directly to the child (\"you\"); use simple words and British spelling; praise specific things; never rewrite the whole composition; when you quote the writing, copy the words exactly; list at most 6 mistakes (spelling, grammar, tense, punctuation), most important first; be honest but kind; judge against what is expected at this level; if the writing is very short, off-topic or not a story, say so gently in \"cheer\" and give tips to get started.\nReply with only JSON in this shape:\n{\"band\":1 to 3 (1=getting there, 2=good work, 3=excellent for this level),\"cheer\":\"one or two encouraging sentences\",\"strengths\":[\"…\",\"…\"],\"improve\":[{\"quote\":\"exact phrase from the writing\",\"tip\":\"what to try\",\"example\":\"an improved version\"}],\"mistakes\":[{\"wrong\":\"…\",\"right\":\"…\",\"why\":\"…\"}],\"upgrade\":{\"before\":\"one sentence from the writing\",\"after\":\"a stronger version\"},\"next\":\"one goal for next time\"}\nGive 2 or 3 items in improve.\nComposition:\n<<<\n"+text.slice(0,12000)+"\n>>>";
}
function answerPrompt(kind,it,answer){
  const strip=s=>String(s||"").replace(/<br\s*\/?>/g," ").replace(/<[^>]+>/g,"");
  if(lang==="zh")return "你是一位亲切的华文小老师，学生是新加坡小学生"+(learnerLevel()?"（"+learnerLevel()+"）":"")+"。\n"+(kind==="fixit"?"练习：改正句子中的错误。\n原句："+strip(it.wrong)+"\n参考答案："+strip(it.right):"练习："+strip(it.q)+"\n参考答案："+strip(it.a))+"\n学生的答案："+answer.slice(0,2000)+"\n请评价学生的答案（不是参考答案）。只要意思合理、符合要求，就算好，不必和参考答案一样。只回复JSON：{\"verdict\":\"great\"或\"good\"或\"try\",\"comment\":\"对学生说的一两句简单的话，指出好的地方或需要改的地方\",\"better\":\"在保留学生想法的前提下，把学生的句子稍微改好\"}";
  return "You are a kind writing coach for a Singapore primary pupil"+(learnerLevel()?" ("+learnerLevel()+")":"")+".\n"+(kind==="fixit"?"Exercise: correct the mistakes in a sentence.\nOriginal: "+strip(it.wrong)+"\nModel correction: "+strip(it.right):"Exercise: "+strip(it.q)+"\nModel answer: "+strip(it.a))+"\nPupil's answer: "+answer.slice(0,2000)+"\nJudge the pupil's answer, not the model. A different answer that does the task well is fine. Reply with only JSON: {\"verdict\":\"great\" or \"good\" or \"try\",\"comment\":\"one or two short, simple sentences to the child about what worked or what to fix\",\"better\":\"the pupil's own answer, improved a little while keeping their idea\"}";
}
function attachAsk(box,kind,it,getAnswer){

function smartQ(h){return String(h).split(/(<[^>]+>)/).map(seg=>seg.startsWith("<")?seg:seg.replace(/(^|[\s(\[—–])"/g,"$1“").replace(/"/g,"”").replace(/(\w)'(\w)/g,"$1’$2").replace(/(^|[\s(\[—–“])'/g,"$1‘").replace(/'/g,"’")).join("")}
const ESS={en:[],zh:[]};(window.ESSAYS||[]).forEach(e=>{if(!ESS[e.lang])return;if(e.lang==="en"){e.paras=e.paras.map(smartQ);e.title=smartQ(e.title)}ESS[e.lang].push(e)});
const ECATS=["kindness","honesty","courage","friendship","family","perseverance","mistakes","school","outings","unexpected"];
const ELV={en:["P1–P2","P3–P4","P5–P6"],zh:["低年级","中年级","高年级"]};
Object.keys(ESS).forEach(l=>ESS[l].sort((a,b)=>ECATS.indexOf(a.cat)-ECATS.indexOf(b.cat)||ELV[l].indexOf(a.level)-ELV[l].indexOf(b.level)||a.id.localeCompare(b.id)));
const L10={en:{lib:"Model Essay Library",libShort:"Essay library",libLead:n=>n+" model compositions to read and enjoy. Choose a topic or a level, open an essay and notice the highlighted phrases. Then borrow the ones you like.",
  phr:"Phrases from model essays",phrLead:"Every highlighted phrase from the essay library, sorted by type. Tap a phrase to save it to your word book, or open the essay it came from.",
  all:"All",allLv:"All levels",search:"Search titles and stories",unread:"Not read yet",read:"Read",words:"words",back:"Back to the library",prev:"Previous essay",next:"Next essay",
  hlOn:"Hide highlights",hlOff:"Show highlights",why:"Why this works",borrow:"Phrases to borrow",done:"I've read it",doneAlready:"You've read this one",readCount:(a,b)=>a+" of "+b+" read",
  none:"No essays match. Try another topic or level.",from:"from",cats:{kindness:"Kindness & helping",honesty:"Honesty",courage:"Courage",friendship:"Friendship",family:"Family",perseverance:"Perseverance & competitions",mistakes:"Mistakes & lessons",school:"School life & CCA",outings:"Outings, trips & festivals",unexpected:"Accidents & surprises"},
  cls:{s:"Five senses",sh:"Show, don't tell",f:"Feeling words",d:"Dialogue",c:"Connectors",fig:"Figurative language",id:"Idioms & good phrases"},essayDay:"Essay of the day",libCard:"Open the library",random:"Surprise me"},
 zh:{lib:"范文库",libShort:"范文库",libLead:n=>"这里有 "+n+" 篇范文，可以慢慢读。选一个主题或年级，打开范文，留意标出来的好词好句，喜欢的就借来用。",
  phr:"范文好词好句",phrLead:"范文库里所有标出来的好词好句，按类别整理好了。点一下就能收藏到好词本，也可以打开它出自的那篇范文。",
  all:"全部",allLv:"全部年级",search:"搜索题目和内容",unread:"还没读",read:"已读",words:"字",back:"回到范文库",prev:"上一篇",next:"下一篇",
  hlOn:"隐藏标记",hlOff:"显示标记",why:"为什么写得好",borrow:"可以借用的好词好句",done:"我读完了",doneAlready:"这篇你已经读过了",readCount:(a,b)=>"已读 "+a+" / "+b,
  none:"没有符合的范文，换个主题或年级试试。",from:"出自",cats:{kindness:"助人为乐",honesty:"诚实",courage:"勇敢",friendship:"友谊",family:"亲情",perseverance:"坚持与比赛",mistakes:"做错事与成长",school:"校园生活",outings:"出游与节日",unexpected:"意外与惊喜"},
  cls:{s:"五感描写",sh:"神态动作",f:"心情词语",d:"对话",c:"过渡词",fig:"修辞手法",id:"好词好句"},essayDay:"今日范文",libCard:"打开范文库",random:"随便读一篇"}};
const lt=()=>L10[lang];
const EIDX={};Object.keys(ESS).forEach(l=>ESS[l].forEach(e=>{EIDX[e.id]=e}));
function eLen(e){const t=e.paras.join(" ").replace(/<[^>]+>/g,"");return e.lang==="zh"?(t.match(/[一-鿿]/g)||[]).length:t.split(/\s+/).filter(Boolean).length}
function eRead(id){return hasStar(lang+"-essay:"+id)}
function eMarks(e){const out=[];e.paras.forEach(p=>{const re=/<mark class="([a-z]+)">([\s\S]*?)<\/mark>/g;let m;while((m=re.exec(p)))out.push({cls:m[1],t:m[2].replace(/<[^>]+>/g,"").trim()})});return out}
function ePreview(e){const t=e.paras[0].replace(/<[^>]+>/g,"");return t.length>110?t.slice(0,lang==="zh"?60:110)+"…":t}
let libState={cat:"",lv:"",q:"",unread:false};
function libFiltered(){const q=libState.q.trim().toLowerCase();return ESS[lang].filter(e=>(!libState.cat||e.cat===libState.cat)&&(!libState.lv||e.level===libState.lv)&&(!libState.unread||!eRead(e.id))&&(!q||(e.title+" "+e.paras.join(" ")).replace(/<[^>]+>/g,"").toLowerCase().includes(q)))}
function pageHead(m,id,eyebrow,title,lead){m.appendChild(el("div","head",'<div class="uhead"><span class="uicon">'+unitIcon(id,56)+'</span><div><span class="eyebrow">'+eyebrow+'</span><h2>'+title+'</h2></div></div><p class="lead">'+lead+'</p>'))}
function finishPage(id,title){current={id,title};document.querySelectorAll("#index [data-u]").forEach(b=>{if(b.dataset.u===id)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#cur").textContent=title;store.set("wiw3-unit-"+lang,id);try{history.replaceState(null,"","#"+id)}catch(e){}
  if(window.matchMedia("(max-width:899px)").matches){$("#index").hidden=true;$("#menuBtn").setAttribute("aria-expanded","false")}markChips()}
function renderLibrary(){const m=$("#main"),t=lt();m.innerHTML="";const open=lstore.get("wiw2-essayopen-"+lang,"");
  if(open&&EIDX[open]&&EIDX[open].lang===lang){renderEssay(EIDX[open]);return}
  pageHead(m,lang+"-essays",s7().readLong,t.lib,t.libLead(ESS[lang].length));
  const nRead=ESS[lang].filter(e=>eRead(e.id)).length;
  const bar=el("div","block",'<div class="row" style="justify-content:space-between"><span class="tag">'+t.readCount(nRead,ESS[lang].length)+'</span><button class="btn ghost small rnd">'+t.random+'</button></div><div class="prog"><i style="width:'+(nRead/Math.max(1,ESS[lang].length)*100)+'%"></i></div>'+
    '<input type="search" class="lsearch" id="libq" placeholder="'+esc(t.search)+'" aria-label="'+esc(t.search)+'">'+
    '<div class="pills" id="libcat">'+['<button class="pill" data-c="" aria-pressed="'+(!libState.cat)+'">'+t.all+' <small>'+ESS[lang].length+'</small></button>'].concat(ECATS.filter(c=>ESS[lang].some(e=>e.cat===c)).map((c,i)=>'<button class="pill" style="--h:'+(i*36)+'" data-c="'+c+'" aria-pressed="'+(libState.cat===c)+'">'+t.cats[c]+' <small>'+ESS[lang].filter(e=>e.cat===c).length+'</small></button>')).join("")+'</div>'+
    '<div class="pills" id="liblv">'+['<button class="pill" data-l="" aria-pressed="'+(!libState.lv)+'">'+t.allLv+'</button>'].concat(ELV[lang].map((v,i)=>'<button class="pill" style="--h:'+[140,210,30][i]+'" data-l="'+esc(v)+'" aria-pressed="'+(libState.lv===v)+'">'+v+'</button>')).join("")+
    '<label class="unreadt"><input type="checkbox" id="libun"'+(libState.unread?' checked':'')+'> '+t.unread+'</label></div>');
  m.appendChild(bar);const list=el("div","esslist");m.appendChild(list);
  function draw(){const L=libFiltered();list.innerHTML=L.length?L.map(e=>'<button class="esscard'+(eRead(e.id)?' isread':'')+'" data-e="'+e.id+'"><span class="tag">'+t.cats[e.cat]+' · '+e.level+' · '+eLen(e)+' '+t.words+(eRead(e.id)?' · ✓ '+t.read:'')+'</span><b>'+esc(e.title)+'</b><span class="pv">'+esc(ePreview(e))+'</span></button>').join(""):'<p class="muted">'+t.none+'</p>'}
  const q=bar.querySelector("#libq");q.value=libState.q;q.addEventListener("input",()=>{libState.q=q.value;draw()});
  bar.querySelector("#libcat").addEventListener("click",ev=>{const b=ev.target.closest("[data-c]");if(!b)return;libState.cat=b.dataset.c;bar.querySelectorAll("#libcat .pill").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  bar.querySelector("#liblv").addEventListener("click",ev=>{const b=ev.target.closest("[data-l]");if(!b)return;libState.lv=b.dataset.l;bar.querySelectorAll("#liblv .pill").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  bar.querySelector("#libun").onchange=ev=>{libState.unread=ev.target.checked;draw()};
  bar.querySelector(".rnd").onclick=()=>{const L=libFiltered().filter(e=>!eRead(e.id));const pool=L.length?L:libFiltered();if(pool.length)openEssay(pool[Math.floor(Math.random()*pool.length)].id)};
  list.addEventListener("click",ev=>{const b=ev.target.closest("[data-e]");if(b)openEssay(b.dataset.e)});
  draw();finishPage(lang+"-essays",t.lib)}
function openEssay(id){lstore.set("wiw2-essayopen-"+lang,id);if(current&&current.id===lang+"-essays"){renderEssay(EIDX[id]);$("#main").scrollIntoView({block:"start"})}else openUnit(lang+"-essays",true)}
function renderEssay(e){const m=$("#main"),t=lt();m.innerHTML="";
  const back=el("button","btn ghost small","← "+t.back);back.onclick=()=>{lstore.set("wiw2-essayopen-"+lang,"");renderLibrary();$("#main").scrollIntoView({block:"start"})};
  m.appendChild(back);
  m.appendChild(el("div","head",'<span class="eyebrow">'+t.cats[e.cat]+' · '+e.level+' · '+eLen(e)+' '+t.words+'</span><h2>'+esc(e.title)+'</h2>'));
  const used=[...new Set(eMarks(e).map(x=>x.cls))];
  const tools=el("div","row");const hb=el("button","btn small",t.hlOn);tools.appendChild(hb);const lb=listenBtn(()=>e.title+(lang==="zh"?"。":". ")+e.paras.join(" "));if(lb)tools.appendChild(lb);m.appendChild(tools);
  const legend=el("div","legend",used.map(c=>'<span class="lg '+c+'">'+t.cls[c]+'</span>').join(""));m.appendChild(legend);
  const art=el("article","essay on",'<h3>'+esc(e.title)+'</h3>'+e.paras.map(p=>'<p>'+p+'</p>').join(""));m.appendChild(art);
  hb.onclick=()=>{const on=art.classList.toggle("on");hb.textContent=on?t.hlOn:t.hlOff;legend.hidden=!on};
  m.appendChild(el("div","card",'<h4>'+t.why+'</h4><ul class="dots">'+e.notes.map(n=>'<li><b>'+esc(n.title)+(lang==="zh"?"：":":")+'</b> '+esc(n.text)+'</li>').join("")+'</ul>'));
  const groups={};eMarks(e).forEach(x=>{if(x.t.length>(lang==="zh"?40:90))return;(groups[x.cls]=groups[x.cls]||[]).push(x.t)});
  m.appendChild(el("div","card",'<h4>'+t.borrow+'</h4>'+Object.keys(t.cls).filter(c=>groups[c]).map(c=>'<span class="tag">'+t.cls[c]+'</span><div class="chips">'+[...new Set(groups[c])].map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div>').join("")));
  const doneB=el("button","btn",eRead(e.id)?"✓ "+t.doneAlready:"★ "+t.done);doneB.disabled=eRead(e.id);doneB.onclick=()=>{giveStar(lang+"-essay:"+e.id,doneB);doneB.textContent="✓ "+t.doneAlready;doneB.disabled=true;refreshNav()};
  m.appendChild(el("div","row")).appendChild(doneB);
  const L=libFiltered().some(x=>x.id===e.id)?libFiltered():ESS[lang];const i=L.findIndex(x=>x.id===e.id),pv=L[i-1],nx=L[i+1];
  const pg=el("div","pager",(pv?'<button data-e="'+pv.id+'"><small>← '+t.prev+'</small>'+esc(pv.title)+'</button>':'')+(nx?'<button class="nx" data-e="'+nx.id+'"><small>'+t.next+' →</small>'+esc(nx.title)+'</button>':''));
  pg.addEventListener("click",ev=>{const b=ev.target.closest("[data-e]");if(b){lstore.set("wiw2-essayopen-"+lang,b.dataset.e);renderEssay(EIDX[b.dataset.e]);$("#main").scrollIntoView({block:"start"})}});
  m.appendChild(pg);finishPage(lang+"-essays",t.lib)}
let phrState={cat:"",q:""};
function renderEssayPhrases(){const m=$("#main"),t=lt();m.innerHTML="";
  pageHead(m,lang+"-essayphrases",s7().readLong,t.phr,t.phrLead);
  const bar=el("div","block",'<input type="search" class="lsearch" id="phq" placeholder="'+esc(lang==="zh"?"搜索好词好句":"Search phrases")+'"><div class="pills" id="phcat">'+['<button class="pill" data-c="" aria-pressed="'+(!phrState.cat)+'">'+t.all+'</button>'].concat(ECATS.filter(c=>ESS[lang].some(e=>e.cat===c)).map((c,i)=>'<button class="pill" style="--h:'+(i*36)+'" data-c="'+c+'" aria-pressed="'+(phrState.cat===c)+'">'+t.cats[c]+'</button>')).join("")+'</div>');
  m.appendChild(bar);const out=el("div","block");m.appendChild(out);
  function draw(){const q=phrState.q.trim().toLowerCase();const by={};
    ESS[lang].filter(e=>!phrState.cat||e.cat===phrState.cat).forEach(e=>eMarks(e).forEach(x=>{if(x.cls==="d"||x.t.length>(lang==="zh"?36:80))return;if(q&&!x.t.toLowerCase().includes(q))return;(by[x.cls]=by[x.cls]||[]).push({t:x.t,e})}));
    const order=["fig","sh","s","f","id","c"];
    out.innerHTML=order.filter(c=>by[c]).map(c=>{const seen=new Set();const items=by[c].filter(x=>{if(seen.has(x.t))return false;seen.add(x.t);return true});
      return '<section class="block"><h3><span class="lg '+c+'" style="padding:2px 10px;border-radius:999px">'+t.cls[c]+'</span> <small class="muted">'+items.length+'</small></h3><div class="phlist">'+items.map(x=>'<span class="phitem"><span class="chip">'+esc(x.t)+'</span><button class="srcb" data-e="'+x.e.id+'" title="'+esc(t.from+" "+x.e.title)+'">'+esc(x.e.title)+' ↗</button></span>').join("")+'</div></section>'}).join("")||'<p class="muted">'+t.none+'</p>';markChips()}
  const q=bar.querySelector("#phq");q.value=phrState.q;q.addEventListener("input",()=>{phrState.q=q.value;draw()});
  bar.querySelector("#phcat").addEventListener("click",ev=>{const b=ev.target.closest("[data-c]");if(!b)return;phrState.cat=b.dataset.c;bar.querySelectorAll("#phcat .pill").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  out.addEventListener("click",ev=>{const b=ev.target.closest(".srcb");if(b){lstore.set("wiw2-essayopen-"+lang,b.dataset.e);openUnit(lang+"-essays",true)}});
  draw();finishPage(lang+"-essayphrases",t.phr)}
function libHomeCard(){if(!ESS[lang].length)return null;const t=lt();const e=ESS[lang][Math.floor(seeded(today()+lang+"essay")()*ESS[lang].length)];
  const c=el("section","block",'<h3>'+t.essayDay+'</h3><div class="card essday"><span class="tag">'+t.cats[e.cat]+' · '+e.level+'</span><h4 style="font-size:1.3rem">'+esc(e.title)+'</h4><p>'+esc(ePreview(e))+'</p><div class="row"><button class="btn small" data-e="'+e.id+'">'+(lang==="zh"?"读这篇":"Read it")+' →</button><button class="btn ghost small lib">'+t.libCard+' ('+ESS[lang].length+')</button></div></div>');
  c.addEventListener("click",ev=>{const b=ev.target.closest("[data-e]");if(b){lstore.set("wiw2-essayopen-"+lang,b.dataset.e);openUnit(lang+"-essays",true)}if(ev.target.closest(".lib")){lstore.set("wiw2-essayopen-"+lang,"");openUnit(lang+"-essays",true)}});return c}

Object.keys(ESS).forEach(l=>{SEARCHTXT[l+"-essays"]=ESS[l].map(e=>e.title+" "+e.paras.join(" ")).join(" ").replace(/<[^>]+>/g," ").toLowerCase();SEARCHTXT[l+"-essayphrases"]=SEARCHTXT[l+"-essays"]});
/*__MODULES__*/
$("#secTabs").addEventListener("click",ev=>{const b=ev.target.closest("[data-sec]");if(b)goSection(b.dataset.sec)});
$("#whoBtn").onclick=openWho;
const h=(location.hash||"").slice(1);
if(h.startsWith("zh-")&&(["zh-today","zh-home","zh-essays","zh-essayphrases"].includes(h)||PAGES[h.slice(3)]||DATA.zh.some(u=>u.id===h)))setLang("zh",h);
else if(h.startsWith("en-")&&(["en-today","en-home","en-essays","en-essayphrases"].includes(h)||PAGES[h.slice(3)]||DATA.en.some(u=>u.id===h)))setLang("en",h);
else setLang(lang);
if(window.matchMedia("(max-width:899px)").matches)$("#index").hidden=true;else $("#index").hidden=false;
renderWho();if(!LID&&!store.get("wiw2-guestOK",false))openWho();
if(HASART){$("#heroArt").innerHTML=sceneSVG({bg:"bedroom",time:"day",actors:[{who:"girl",x:150,pose:"sit",face:"happy",hold:"book",hair:"ponytail",skin:"tan",top:"yellow",bottom:"navy"},{who:"boy",x:285,pose:"point",face:"laughing",hair:"spiky",skin:"light",top:"teal",bottom:"navy",flip:true}],props:[{k:"desk",x:165}],fx:[{k:"lightbulb",x:150,y:55},{k:"sparkle",x:300,y:60}]})}
})();
</script>
